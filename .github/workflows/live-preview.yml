name: Live Preview

on:
  workflow_dispatch:
    inputs:
      preview_minutes:
        description: 预览开多久（1-20 分钟）
        type: number
        default: 12

permissions:
  contents: read

concurrency:
  group: live-preview
  cancel-in-progress: true

jobs:
  preview:
    uses: wenjinliuu/ios-ci-workflows/.github/workflows/live-preview.yml@df71d6096d6d39ea799179cb2635703548b07ae0 # v1.1.0
    with:
      # workflow_dispatch 的 number 实际是字符串，必须 fromJSON 才能交给 reusable 的 number 入参
      preview_minutes: ${{ fromJSON(inputs.preview_minutes) }}
    secrets:
      AGENT_PREVIEW_PASSWORD: ${{ secrets.AGENT_PREVIEW_PASSWORD }}
