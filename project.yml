name: MT741
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES

targets:
  MT741:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.mt741
        PRODUCT_NAME: MT741
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: MT741
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_NSAppTransportSecurity_AllowsArbitraryLoads: NO
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        LSApplicationQueriesSchemes:
          - alipays
          - alipay
          - jdpay
          - jdpayopen
          - jdmobilejdpay
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        CFBundleDisplayName: MT741
    scheme:
      testTargets:
        - MT741Tests
        - MT741UITests

  MT741Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/UnitTests
    dependencies:
      - target: MT741
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.mt741.tests
        GENERATE_INFOPLIST_FILE: YES

  MT741UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UITests
    dependencies:
      - target: MT741
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.mt741.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MT741

schemes:
  MT741:
    build:
      targets:
        MT741: all
        MT741Tests: [test]
        MT741UITests: [test]
    test:
      config: Debug
      targets:
        - MT741Tests
        - MT741UITests
